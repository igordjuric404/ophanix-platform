routing:
  first_read:
    - AGENTS.md
    - project-context/MAP.md
    - project-context/FEATURE_MAP.md
    - project-context/CODEBASE_MAP.md
    - project-context/runbooks/validation.md
    - .github/copilot-instructions.md
  source_areas:
    - path: packages/product-platform/
      responsibility: Ophanix product-platform implementation.
    - path: packages/agent-os/
      responsibility: Governance and policy engine.
    - path: packages/agent-mesh/
      responsibility: Trust, identity, mesh communication, schemas, and deployment assets.
    - path: packages/agentmesh-integrations/
      responsibility: Framework adapters.
    - path: packages/agent-compliance/
      responsibility: Compliance verification and schemas.
    - path: packages/agent-sre/
      responsibility: Reliability, dashboards, operator, and deployments.
    - path: packages/agent-runtime/
      responsibility: Runtime behavior.
    - path: packages/agent-hypervisor/
      responsibility: Sandboxing and hypervisor controls.
    - path: docs/product-platform-worktree/
      responsibility: Existing Ophanix product-platform plans, logs, and audits.
ignore:
  - node_modules/
  - .mypy_cache/
  - .ruff_cache/
  - .pytest_cache/
  - __pycache__/
  - dist/
  - build/
  - .venv-codex-product/
rules:
  - Keep authored knowledge in Markdown with project-context frontmatter.
  - Keep machine routing in this file.
  - Preserve upstream toolkit instructions when editing inherited packages.
  - Do not index generated caches as canonical source.
  - Update feature docs and validation runbook when package ownership or validation changes.
