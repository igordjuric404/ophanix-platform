features:
  - id: FEAT-0001
    name: Product Platform and Tool Gateway
    path: project-context/features/FEAT-0001-product-platform-tool-gateway.md
  - id: FEAT-0002
    name: Agent OS Governance
    path: project-context/features/FEAT-0002-agent-os-governance.md
  - id: FEAT-0003
    name: Agent Mesh Trust and Identity
    path: project-context/features/FEAT-0003-agent-mesh-trust-identity.md
  - id: FEAT-0004
    name: Framework Integrations
    path: project-context/features/FEAT-0004-framework-integrations.md
  - id: FEAT-0005
    name: Compliance and Agent SRE
    path: project-context/features/FEAT-0005-compliance-agent-sre.md
  - id: FEAT-0006
