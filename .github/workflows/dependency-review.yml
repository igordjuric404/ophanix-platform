name: Dependency Review
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'notebooks/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Skip dependency review when unavailable
        if: ${{ vars.ENABLE_DEPENDENCY_REVIEW != 'true' }}
        run: |
          echo "Dependency Review requires Dependency Graph support on this repository."
          echo "Set repository variable ENABLE_DEPENDENCY_REVIEW=true after enabling those features."
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: ${{ vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          allow-licenses: >
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC,
            PSF-2.0, Python-2.0, 0BSD, Unlicense, CC0-1.0,
            CC-BY-4.0, Zlib, BSL-1.0, MPL-2.0
