name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Path detection — determines which jobs to run ─────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      python-packages: ${{ steps.python-matrix.outputs.packages }}
      python-versions: ${{ steps.python-matrix.outputs.versions }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      typescript: ${{ steps.filter.outputs.typescript }}
      integrations: ${{ steps.filter.outputs.integrations }}
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docs-only: ${{ steps.filter.outputs.docs-only }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            python:
              - 'packages/agent-os/**'
              - 'packages/agent-mesh/**'
              - 'packages/agent-hypervisor/**'
              - 'packages/agent-sre/**'
              - 'packages/agent-compliance/**'
              - 'packages/agent-runtime/**'
              - 'packages/agent-lightning/**'
              - 'packages/product-platform/**'
              - 'packages/ophanix-tool-gateway-sdk/**'
              - 'scripts/**'
              - 'requirements/**'
            agent-os:
              - 'packages/agent-os/**'
            agent-mesh:
              - 'packages/agent-mesh/**'
            agent-hypervisor:
              - 'packages/agent-hypervisor/**'
            agent-sre:
              - 'packages/agent-sre/**'
            agent-compliance:
              - 'packages/agent-compliance/**'
            agent-runtime:
              - 'packages/agent-runtime/**'
            agent-lightning:
              - 'packages/agent-lightning/**'
            product-platform:
              - 'packages/product-platform/**'
            ophanix-tool-gateway-sdk:
              - 'packages/ophanix-tool-gateway-sdk/**'
            dotnet:
              - 'packages/agent-governance-dotnet/**'
            typescript:
              - 'packages/agent-mesh/sdks/typescript/**'
              - 'packages/agent-os/extensions/**'
              - 'packages/agentmesh-integrations/mastra-agentmesh/**'
              - 'packages/agentmesh-integrations/copilot-governance/**'
            integrations:
              - 'packages/agentmesh-integrations/**'
            workflows:
              - '.github/workflows/**'
            rust:
              - 'packages/agent-mesh/sdks/rust/**'
            go:
              - 'packages/agent-mesh/sdks/go/**'
            docs-only:
              - '**/*.md'
              - 'notebooks/**'
              - 'docs/**'
      - name: Build Python package matrix
        id: python-matrix
        shell: bash
        run: |
          all_packages=(
            '"agent-os"'
            '"agent-mesh"'
            '"agent-hypervisor"'
            '"agent-sre"'
            '"agent-compliance"'
            '"agent-runtime"'
            '"agent-lightning"'
            '"product-platform"'
            '"ophanix-tool-gateway-sdk"'
          )

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            packages=$(IFS=,; echo "${all_packages[*]}")
            echo "packages=[$packages]" >> "$GITHUB_OUTPUT"
            echo 'versions=["3.10","3.11","3.12","3.13"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          packages=()
          [[ "${{ steps.filter.outputs['agent-os'] }}" == "true" ]] && packages+=('"agent-os"')
          [[ "${{ steps.filter.outputs['agent-mesh'] }}" == "true" ]] && packages+=('"agent-mesh"')
          [[ "${{ steps.filter.outputs['agent-hypervisor'] }}" == "true" ]] && packages+=('"agent-hypervisor"')
          [[ "${{ steps.filter.outputs['agent-sre'] }}" == "true" ]] && packages+=('"agent-sre"')
          [[ "${{ steps.filter.outputs['agent-compliance'] }}" == "true" ]] && packages+=('"agent-compliance"')
          [[ "${{ steps.filter.outputs['agent-runtime'] }}" == "true" ]] && packages+=('"agent-runtime"')
          [[ "${{ steps.filter.outputs['agent-lightning'] }}" == "true" ]] && packages+=('"agent-lightning"')
          [[ "${{ steps.filter.outputs['product-platform'] }}" == "true" ]] && packages+=('"product-platform"')
          [[ "${{ steps.filter.outputs['ophanix-tool-gateway-sdk'] }}" == "true" ]] && packages+=('"ophanix-tool-gateway-sdk"')

          is_dependabot_pr=false
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.user.login }}" == "dependabot[bot]" ]]; then
            is_dependabot_pr=true
          fi

          if [[ "$is_dependabot_pr" != "true" && "${{ steps.filter.outputs.python }}" == "true" ]]; then
            packages=("${all_packages[@]}")
          elif [[ ${#packages[@]} -eq 0 && "${{ steps.filter.outputs.python }}" == "true" ]]; then
            packages=("${all_packages[@]}")
          fi

          joined=$(IFS=,; echo "${packages[*]}")
          echo "packages=[$joined]" >> "$GITHUB_OUTPUT"

          if [[ "$is_dependabot_pr" == "true" ]]; then
            echo 'versions=["3.11"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["3.10","3.11","3.12","3.13"]' >> "$GITHUB_OUTPUT"
          fi

  # ── Python lint + test (only when Python files change) ────────────────
  lint:
    needs: changes
    if: needs.changes.outputs['python-packages'] != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs['python-packages']) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install --require-hashes --no-cache-dir -r requirements/ci-lint.txt
      - name: Lint ${{ matrix.package }}
        run: |
          if [[ "${{ matrix.package }}" == "product-platform" || "${{ matrix.package }}" == "ophanix-tool-gateway-sdk" ]]; then
            cd packages/${{ matrix.package }}
            paths=(src)
            [[ -d tests ]] && paths+=(tests)
            [[ -d scripts ]] && paths+=(scripts)
            ruff check "${paths[@]}" --select E,F,W --ignore E501
          else
            ruff check packages/${{ matrix.package }}/src/ --select E,F,W --ignore E501
          fi
      - name: Type check Tool Gateway SDK
        if: matrix.package == 'ophanix-tool-gateway-sdk'
        working-directory: packages/ophanix-tool-gateway-sdk
        run: |
          pip install --no-cache-dir ".[dev]"
          python -m mypy src/ophanix_tool_gateway
      - name: Type check Product Tool Gateway surface
        if: matrix.package == 'product-platform'
        working-directory: packages/product-platform
        run: |
          pip install --no-cache-dir -e ../agent-discovery -e ../agent-mesh -e ".[dev]"
          python -m mypy src/product_platform/tool_gateway src/ophanix_tool_gateway

  # ── Python test (only when Python files change) ───────────────────────
  test:
    needs: changes
    if: needs.changes.outputs['python-packages'] != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs['python-packages']) }}
        python-version: ${{ fromJSON(needs.changes.outputs['python-versions']) }}
        exclude:
          - package: agent-mesh
            python-version: "3.10"
          - package: agent-hypervisor
            python-version: "3.10"
          - package: agent-compliance
            python-version: "3.10"
          - package: agent-runtime
            python-version: "3.10"
          - package: agent-lightning
            python-version: "3.10"
          - package: product-platform
            python-version: "3.10"
          - package: ophanix-tool-gateway-sdk
            python-version: "3.10"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: |
          if [[ "${{ matrix.package }}" == "product-platform" ]]; then
            pip install --no-cache-dir -e ../agent-os -e ../agent-discovery -e ../agent-mesh -e ".[dev]"
          elif [[ "${{ matrix.package }}" == "ophanix-tool-gateway-sdk" ]]; then
            pip install --no-cache-dir -e ".[dev]"
          else
            pip install --no-cache-dir -e ".[dev]" 2>/dev/null || pip install --no-cache-dir -e ".[test]" 2>/dev/null || pip install --no-cache-dir -e .
            pip install --no-cache-dir pytest==8.4.1 pytest-asyncio==0.26.0 2>/dev/null || true
          fi
      - name: Test ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: pytest tests/ -q --tb=short

  # ── PyPI package build (only when Python files change) ────────────────
  build-pypi:
    needs: changes
    if: needs.changes.outputs['python-packages'] != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs['python-packages']) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install --no-cache-dir build==1.2.2 setuptools==75.8.0
      - name: Build ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: python -m build
      - name: Verify wheel
        working-directory: packages/${{ matrix.package }}
        run: ls -la dist/*.whl
      - name: Validate Tool Gateway SDK release artifacts
        if: matrix.package == 'ophanix-tool-gateway-sdk'
        working-directory: packages/ophanix-tool-gateway-sdk
        run: |
          python -m pip install --no-cache-dir ".[release,security]"
          python scripts/validate_release.py --out-dir /tmp/ophanix-sdk-ci-release --require-dependency-audit
      - name: Validate Product Platform release artifacts
        if: matrix.package == 'product-platform'
        working-directory: packages/product-platform
        run: |
          python -m pip install --no-cache-dir ".[release,security]"
          python scripts/validate_release.py --out-dir /tmp/ophanix-product-ci-release --require-dependency-audit
      - name: Test Tool Gateway SDK minimum runtime dependencies
        if: matrix.package == 'ophanix-tool-gateway-sdk'
        working-directory: packages/ophanix-tool-gateway-sdk
        run: |
          python -m pip install --no-cache-dir -e ".[dev]"
          python -m pip install --no-cache-dir --force-reinstall "httpx==0.27.0"
          pytest tests/ -q --tb=short

  # ── Python dependency safety (only when Python files change) ──────────
  security:
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'schedule') && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install dependency audit tooling
        run: pip install --no-cache-dir pip-audit==2.9.0
      - name: Check dependencies
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          for pkg in agent-os agent-mesh agent-hypervisor agent-sre agent-compliance agent-runtime agent-lightning product-platform ophanix-tool-gateway-sdk; do
            echo "=== $pkg ==="
            cd packages/$pkg
            if [[ "$pkg" == "product-platform" ]]; then
              pip install --no-cache-dir -e ../agent-discovery -e ../agent-mesh -e ".[security]"
            elif [[ "$pkg" == "ophanix-tool-gateway-sdk" ]]; then
              pip install --no-cache-dir -e ".[security]"
            else
              pip install --no-cache-dir -e . 2>/dev/null || true
            fi
            cd ../..
          done
          pip-audit --progress-spinner off

  # ── .NET build + test (only when C# files change) ────────────────────
  test-dotnet:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "8.0.x"
      - name: Build .NET SDK
        working-directory: packages/agent-governance-dotnet
        run: dotnet build --configuration Release --verbosity quiet
      - name: Test .NET SDK
        working-directory: packages/agent-governance-dotnet
        run: dotnet test --configuration Release --verbosity normal --no-build
      - name: Pack NuGet
        working-directory: packages/agent-governance-dotnet
        run: dotnet pack src/AgentGovernance/AgentGovernance.csproj --configuration Release --no-build --output ./nupkg
      - name: Verify NuGet package
        working-directory: packages/agent-governance-dotnet
        run: ls -la ./nupkg/*.nupkg

  # ── Integration tests (only when integration packages change) ────────
  test-integrations:
    needs: changes
    if: needs.changes.outputs.integrations == 'true' || github.event_name == 'schedule' || (needs.changes.outputs.python == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: a2a-protocol
            import-module: a2a_agentmesh
          - package: crewai-agentmesh
            import-module: crewai_agentmesh
          - package: flowise-agentmesh
            import-module: flowise_agentmesh
          - package: haystack-agentmesh
            import-module: haystack_agentmesh
          - package: langchain-agentmesh
            import-module: langchain_agentmesh
          - package: langflow-agentmesh
            import-module: langflow_agentmesh
          - package: langgraph-trust
            import-module: langgraph_trust
          - package: llamaindex-agentmesh
            import-module: llama_index.agent.agentmesh
          - package: mcp-trust-proxy
            import-module: mcp_trust_proxy
          - package: nostr-wot
            import-module: agentmesh_nostr_wot
          - package: openai-agents-agentmesh
            import-module: openai_agents_agentmesh
          - package: openai-agents-trust
            import-module: openai_agents_trust
          - package: pydantic-ai-governance
            import-module: pydantic_ai_governance
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install ${{ matrix.package }}
        working-directory: packages/agentmesh-integrations/${{ matrix.package }}
        run: |
          pip install --no-cache-dir -e ".[dev]" 2>/dev/null || pip install --no-cache-dir -e ".[test]" 2>/dev/null || pip install --no-cache-dir -e .  # Install local package (Scorecard: pinned via pyproject.toml)
          pip install --no-cache-dir pytest==8.4.1 pytest-asyncio==0.26.0 2>/dev/null || true
      - name: Validate Python syntax
        working-directory: packages/agentmesh-integrations/${{ matrix.package }}
        run: |
          python -c "
          import ast, glob, sys
          errors = 0
          for f in glob.glob('**/*.py', recursive=True):
              try:
                  with open(f) as fh:
                      ast.parse(fh.read(), f)
              except SyntaxError as e:
                  print(f'FAIL {f}: {e}')
                  errors += 1
          if errors:
              sys.exit(1)
          print('All Python files parse successfully')
          "
      - name: Smoke test — import ${{ matrix.import-module }}
        run: python -c "import ${{ matrix.import-module }}"
        continue-on-error: true
      - name: Run tests
        working-directory: packages/agentmesh-integrations/${{ matrix.package }}
        run: |
          if [ -d tests ]; then
            pytest tests/ -q --tb=short
          else
            echo "No tests/ directory — smoke import passed"
          fi

  # ── Dependency confusion scan (always runs — security gate) ──────────
  dependency-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Dependency confusion scan
        run: python scripts/check_dependency_confusion.py --strict
      - name: Notebook pip-install audit
        run: |
          python -c "
          import json, glob, sys, re
          REGISTERED = {
              'agent-os-kernel','agentmesh-platform','agent-hypervisor',
              'agentmesh-runtime','agent-sre','agent-governance-toolkit',
              'agentmesh-lightning','agentmesh-marketplace',
              'pydantic','pyyaml','cryptography','pynacl','click','rich',
              'httpx','aiohttp','fastapi','uvicorn','structlog','numpy',
              'scipy','openai','anthropic','langchain','crewai',
              'streamlit','plotly','pandas','networkx','aioredis',
              'langchain-openai','langchain-core','python-dotenv',
              'agent-primitives','emk',
          }
          bad = []
          for nb in glob.glob('**/*.ipynb', recursive=True):
              if 'node_modules' in nb or '.ipynb_checkpoints' in nb:
                  continue
              try:
                  cells = json.load(open(nb))['cells']
              except Exception:
                  continue
              for c in cells:
                  for line in c.get('source', []):
                      if 'pip install' in line and not line.strip().startswith('#') and not line.strip().startswith('>'):
                          pkgs = re.findall(r'(?:pip install\s+)(.+)', line)
                          if pkgs:
                              for p in pkgs[0].split():
                                  name = re.sub(r'[^a-zA-Z0-9._-]', '', re.sub(r'\[.*\]', '', p))
                                  if (name and not name.startswith('-') and not name.startswith('.')
                                      and not name.startswith('http') and name not in REGISTERED
                                      and not name.startswith('--')):
                                      bad.append(f'{nb}: {name}')
          if bad:
              print('UNREGISTERED PACKAGES IN NOTEBOOKS:')
              for b in bad:
                  print(f'  {b}')
              sys.exit(1)
          print(f'OK: All notebook pip install packages are registered')
          "

  # ── Workflow security audit (only when workflows change) ─────────────
  workflow-security:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Audit pull_request_target workflows
        run: |
          echo "=== Checking pull_request_target safety ==="
          UNSAFE=0
          for f in .github/workflows/*.yml; do
            if grep -q 'pull_request_target' "$f"; then
              # Only flag if actions/checkout has ref: pointing to head (unsafe)
              # Uses awk to check checkout blocks specifically, not unrelated lines
              if awk '/actions\/checkout/{found=1} found && /ref:.*head\.(ref|sha)/{print; exit 1}' "$f" 2>/dev/null; then
                echo "OK: $f (pull_request_target, base-only checkout)"
              else
                echo "UNSAFE: $f checks out PR head in pull_request_target context"
                UNSAFE=1
              fi
            fi
          done
          if [ $UNSAFE -eq 1 ]; then exit 1; fi

  # ── TypeScript integration tests (only when TS files change) ─────────
  test-integrations-ts:
    needs: changes
    if: needs.changes.outputs.typescript == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: Install mastra-agentmesh
        working-directory: packages/agentmesh-integrations/mastra-agentmesh
        run: npm ci 2>/dev/null || npm install --ignore-scripts
      - name: Lint mastra-agentmesh
        working-directory: packages/agentmesh-integrations/mastra-agentmesh
        run: npm run lint 2>/dev/null || true
      - name: Test mastra-agentmesh
        working-directory: packages/agentmesh-integrations/mastra-agentmesh
        run: npm test
      - name: Install copilot-governance
        working-directory: packages/agentmesh-integrations/copilot-governance
        run: npm ci 2>/dev/null || npm install --ignore-scripts
      - name: Lint copilot-governance
        working-directory: packages/agentmesh-integrations/copilot-governance
        run: npm run lint 2>/dev/null || true
      - name: Test copilot-governance
        working-directory: packages/agentmesh-integrations/copilot-governance
        run: npm test

  # ── npm package build + test (only when TS files change) ──────────────
  build-npm:
    needs: changes
    if: needs.changes.outputs.typescript == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agentmesh-mcp-proxy
            path: packages/agent-mesh/packages/mcp-proxy
          - name: agentmesh-sdk
            path: packages/agent-mesh/sdks/typescript
          - name: agentmesh-api
            path: packages/agent-mesh/services/api
          - name: agent-os-copilot-extension
            path: packages/agent-os/extensions/copilot
          - name: agentos-mcp-server
            path: packages/agent-os/extensions/mcp-server
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci --legacy-peer-deps 2>/dev/null || npm install --legacy-peer-deps --ignore-scripts
      - name: Build ${{ matrix.name }}
        working-directory: ${{ matrix.path }}
        run: npm run build
      - name: Test ${{ matrix.name }}
        working-directory: ${{ matrix.path }}
        run: npm test 2>/dev/null || echo "No tests configured"

  # ── Rust build + test (only when Rust files change) ──────────────────
  build-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Build
        working-directory: packages/agent-mesh/sdks/rust/agentmesh
        run: cargo build --release
      - name: Test
        working-directory: packages/agent-mesh/sdks/rust/agentmesh
        run: cargo test --release

  # ── Go build + test (only when Go files change) ─────────────────────
  build-go:
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.22"
      - name: Build
        working-directory: packages/agent-mesh/sdks/go
        run: go build ./...
      - name: Test
        working-directory: packages/agent-mesh/sdks/go
        run: go test ./...
      - name: Vet
        working-directory: packages/agent-mesh/sdks/go
        run: go vet ./...

  # ── CI Gate — required status check that handles skipped jobs ────────
  # When path-filters skip jobs (e.g. docs-only PRs skip tests), those
  # jobs report "skipped" which doesn't satisfy required status checks.
  # This gate job always runs, checks that no jobs FAILED, and reports
  # success. Configure this as the single required status check.
  ci-complete:
    if: always()
    needs: [changes, lint, test, build-pypi, security, test-dotnet, test-integrations, dependency-scan, workflow-security, test-integrations-ts, build-npm, build-rust, build-go]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"failure"|"cancelled"'; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "All jobs passed or were correctly skipped"
