name: ophanix-product-demo

x-product-platform-env: &product-platform-env
  OPHANIX_APP_NAME: ${OPHANIX_APP_NAME:-Ophanix Product Platform}
  OPHANIX_ENVIRONMENT: ${OPHANIX_ENVIRONMENT:-local-demo}
  OPHANIX_BUILD_SHA: ${OPHANIX_BUILD_SHA:-local-demo}
  OPHANIX_BUILD_TIME: ${OPHANIX_BUILD_TIME:-local}
  OPHANIX_DATABASE_URL: ${OPHANIX_DATABASE_URL:-sqlite:////data/ophanix_product.db}
  OPHANIX_DEFAULT_ORGANIZATION_ID: ${OPHANIX_DEFAULT_ORGANIZATION_ID:-org_default}
  OPHANIX_DEV_LOGIN_ALLOWED_EMAILS: ${OPHANIX_DEV_LOGIN_ALLOWED_EMAILS:-admin@example.com,demo@example.com}
  OPHANIX_SESSION_SECRET: ${OPHANIX_SESSION_SECRET:-replace-with-a-long-local-secret}
  OPHANIX_SESSION_TTL_SECONDS: ${OPHANIX_SESSION_TTL_SECONDS:-28800}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ophanix_product}
      POSTGRES_USER: ${POSTGRES_USER:-ophanix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ophanix-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - product_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - product_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate-seed:
    build:
      context: ../..
      dockerfile: packages/product-platform/Dockerfile.demo
    command: ["db", "seed"]
    environment: *product-platform-env
    volumes:
      - product_api_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: packages/product-platform/Dockerfile.demo
    command: ["serve", "--host", "0.0.0.0", "--port", "8088"]
    environment: *product-platform-env
    ports:
      - "${PRODUCT_API_PORT:-8088}:8088"
    volumes:
      - product_api_data:/data
    depends_on:
      migrate-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/ready', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: packages/product-platform/Dockerfile.demo
    command: ["worker", "loop", "--interval-seconds", "10"]
    environment: *product-platform-env
    volumes:
      - product_api_data:/data
    depends_on:
      migrate-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "product_platform.cli", "worker", "noop"]
      interval: 10s
      timeout: 3s
      retries: 20

  sample-mcp:
    build:
      context: ../..
      dockerfile: packages/product-platform/Dockerfile.demo
    command: ["demo-service", "serve", "--service", "mcp", "--port", "8091"]
    ports:
      - "${DEMO_MCP_PORT:-8091}:8091"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "product_platform.cli",
          "demo-service",
          "health",
          "--url",
          "http://127.0.0.1:8091/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 20

  support-agent:
    build:
      context: ../..
      dockerfile: packages/product-platform/Dockerfile.demo
    command:
      [
        "demo-service",
        "serve",
        "--service",
        "agent",
        "--agent-id",
        "agent_demo_support",
        "--port",
        "8092",
      ]
    ports:
      - "${DEMO_SUPPORT_AGENT_PORT:-8092}:8092"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "product_platform.cli",
          "demo-service",
          "health",
          "--url",
          "http://127.0.0.1:8092/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 20

  refund-agent:
    build:
      context: ../..
      dockerfile: packages/product-platform/Dockerfile.demo
    command:
      [
        "demo-service",
        "serve",
        "--service",
        "agent",
        "--agent-id",
        "agent_demo_refund",
        "--port",
        "8093",
      ]
    ports:
      - "${DEMO_REFUND_AGENT_PORT:-8093}:8093"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "product_platform.cli",
          "demo-service",
          "health",
          "--url",
          "http://127.0.0.1:8093/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 20

  research-agent:
    build:
      context: ../..
      dockerfile: packages/product-platform/Dockerfile.demo
    command:
      [
        "demo-service",
        "serve",
        "--service",
        "agent",
        "--agent-id",
        "agent_demo_research",
        "--port",
        "8094",
      ]
    ports:
      - "${DEMO_RESEARCH_AGENT_PORT:-8094}:8094"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "product_platform.cli",
          "demo-service",
          "health",
          "--url",
          "http://127.0.0.1:8094/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 20

  opa:
    profiles: ["policy"]
    image: openpolicyagent/opa:0.70.0-rootless
    command: ["run", "--server", "--addr", "0.0.0.0:8181"]
    ports:
      - "${OPA_PORT:-8181}:8181"
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 10s
      timeout: 3s
      retries: 20

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.102.1
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/otel-collector.demo.yml:/etc/otelcol/config.yml:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:13133/",
        ]
      interval: 10s
      timeout: 3s
      retries: 20

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.demo.yml:/etc/prometheus/prometheus.yml:ro
      - product_prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      sample-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 20

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ophanix-local}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - product_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ../..
      dockerfile: packages/product-platform/deploy/cloud/Dockerfile.frontend
    ports:
      - "${PRODUCT_FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend/nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  product_api_data:
  product_postgres_data:
  product_prometheus_data:
  product_grafana_data:
  product_redis_data:
