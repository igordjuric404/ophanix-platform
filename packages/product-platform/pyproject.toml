[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ophanix-product-platform"
version = "0.1.0"
description = "Ophanix product control plane and application shell."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
license-files = ["LICENSE"]
dependencies = [
    "agent-discovery>=0.1.0,<1.0",
    "agentmesh-platform>=3.1.0,<4.0",
    "fastapi>=0.115.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "jsonschema>=4.22.0,<5.0",
    "pydantic[email]>=2.4.0,<3.0",
    "uvicorn>=0.27.0,<1.0",
]

[project.scripts]
ophanix-product-api = "product_platform.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/product_platform", "src/ophanix_tool_gateway"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "*.db",
    "*.db.*",
    "*.sqlite",
    "*.sqlite3",
    "**/__pycache__",
    "**/*.pyc",
    "/frontend/node_modules",
    "/frontend/dist",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
