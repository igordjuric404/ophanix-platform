[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ophanix-tool-gateway-sdk"
version = "0.1.0"
description = "Lightweight Python SDK for calling Ophanix Tool Gateway tools."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
license-files = ["LICENSE"]
authors = [{name = "Ophanix Maintainers"}]
maintainers = [{name = "Ophanix Maintainers"}]
dependencies = [
    "httpx>=0.27.0,<1.0",
    "packaging>=23,<27",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://github.com/ophanix/ophanix-platform/tree/main/packages/ophanix-tool-gateway-sdk"
Source = "https://github.com/ophanix/ophanix-platform"
Issues = "https://github.com/ophanix/ophanix-platform/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<3",
    "pytest==9.0.3",
]
release = [
    "build>=1.2.2,<2",
    "twine>=5.1,<7",
]
security = [
    "pip-audit>=2.7,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ophanix_tool_gateway"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/examples",
    "/scripts",
    "/tests",
    "/README.md",
    "/API_REFERENCE.md",
    "/MIGRATION.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src/ophanix_tool_gateway"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
